<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090c">
<title>AKI DELIVERY | إرسال الموقع</title>
<style>
:root{
  --orange:#ff3b16;
  --orange2:#ff6a00;
  --green:#20d66b;
  --bg:#050608;
  --text:#fff;
  --muted:#aeb4bd;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;overflow-x:hidden}

/* Logo as a subtle background filter */
.bg-logo{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 18%,rgba(255,80,20,.10),transparent 28%),
    linear-gradient(180deg,rgba(5,6,8,.45),rgba(5,6,8,.92));
  opacity:.95;
}


/* Moving speed / wind lines */
.wind,.wind:before,.wind:after{
  position:fixed;z-index:1;pointer-events:none;
  content:"";height:2px;border-radius:99px;
  background:linear-gradient(90deg,transparent,rgba(255,106,0,.0),rgba(255,106,0,.75),transparent);
  width:38vw;max-width:420px;
  animation:wind 3.5s linear infinite;
}
.wind{top:22%;right:-45vw}
.wind:before{top:160px;right:12vw;width:28vw;animation-delay:1s}
.wind:after{top:310px;right:-8vw;width:22vw;animation-delay:2s}
@keyframes wind{
  0%{transform:translateX(0);opacity:0}
  20%{opacity:1}
  100%{transform:translateX(-150vw);opacity:0}
}

/* Decorative smoke */

.logo-speed{
  position:fixed;z-index:1;pointer-events:none;height:3px;border-radius:99px;
  background:linear-gradient(90deg,transparent,rgba(255,106,0,.9),rgba(255,190,100,.35),transparent);
  filter:blur(.2px);opacity:.7;animation:logoSpeed 1.8s linear infinite;
}
.speed-a{width:150px;top:30%;left:-170px;animation-delay:.1s}
.speed-b{width:95px;top:43%;left:-120px;animation-delay:.7s}
.speed-c{width:120px;top:57%;left:-150px;animation-delay:1.2s}
@keyframes logoSpeed{
  0%{transform:translateX(0);opacity:0}
  12%{opacity:.75}
  100%{transform:translateX(125vw);opacity:0}
}
.smoke{
  position:fixed;left:-30px;bottom:7%;width:180px;height:120px;z-index:1;
  opacity:.28;filter:blur(12px);pointer-events:none;
  background:
    radial-gradient(circle at 25% 65%,#fff 0 8%,transparent 24%),
    radial-gradient(circle at 55% 42%,#ddd 0 10%,transparent 28%),
    radial-gradient(circle at 80% 68%,#bbb 0 8%,transparent 25%);
  animation:smoke 5s ease-in-out infinite alternate;
}
@keyframes smoke{
  to{transform:translate(80px,-35px) scale(1.35);opacity:.08}
}

.wrap{position:relative;z-index:2;width:min(94%,470px);margin:auto;padding:24px 0 30px}
.card{
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.11);
  border-radius:30px;
  background:rgba(9,11,15,.78);
  backdrop-filter:blur(14px);
  box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 45px rgba(255,59,22,.09);
  padding:24px 20px 22px;
}
.card:before{
  content:"";position:absolute;inset:-1px;border-radius:30px;padding:1px;
  background:linear-gradient(135deg,rgba(255,106,0,.7),transparent 35%,rgba(255,255,255,.1),transparent 70%,rgba(255,59,22,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.logo{
  width:145px;height:145px;object-fit:contain;display:block;margin:0 auto 4px;
  filter:drop-shadow(0 10px 22px rgba(255,69,20,.22));
}
.logo-motion{animation:logoFloat 2.8s ease-in-out infinite;transform-origin:center bottom;}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}50%{transform:translateY(-6px) rotate(-1deg) scale(1.015)}}
h1{text-align:center;margin:3px 0 5px;font-size:28px;font-weight:900;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto 18px}

.status{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:11px 14px;border-radius:14px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);
  font-size:13px;color:#ddd;margin-bottom:16px
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 13px var(--orange)}
.dot.ready{background:var(--green);box-shadow:0 0 13px var(--green)}

.speed-panel{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:12px 0 18px;padding:12px 14px;
  border-radius:18px;background:linear-gradient(100deg,rgba(255,59,22,.13),rgba(255,255,255,.035));
  border:1px solid rgba(255,106,0,.16)
}
.speed-number{font-size:29px;font-weight:900;font-style:italic}
.speed-label{font-size:11px;color:#aeb4bd}
.bars{display:flex;gap:4px;align-items:end;height:30px}
.bars i{display:block;width:5px;border-radius:5px;background:var(--orange);animation:pulse 1.1s ease-in-out infinite}
.bars i:nth-child(1){height:10px}.bars i:nth-child(2){height:16px;animation-delay:.1s}
.bars i:nth-child(3){height:22px;animation-delay:.2s}.bars i:nth-child(4){height:28px;animation-delay:.3s}
@keyframes pulse{50%{opacity:.35;transform:scaleY(.55)}}

button{
  width:100%;border:0;border-radius:17px;padding:16px 14px;margin-top:11px;
  font-size:17px;font-weight:900;color:#fff;cursor:pointer;
  transition:.18s transform,.18s filter,.18s opacity;
}
button:active{transform:scale(.98)}
button:disabled{opacity:.42;cursor:not-allowed}
.whatsapp{background:linear-gradient(135deg,#18c968,#0fae58);box-shadow:0 12px 28px rgba(32,214,107,.18)}
.sms{background:linear-gradient(135deg,#303640,#171a20);border:1px solid rgba(255,255,255,.12)}
.location-btn{background:linear-gradient(135deg,var(--orange),var(--orange2));box-shadow:0 12px 28px rgba(255,76,20,.20)}
.footer{text-align:center;color:#737a84;font-size:11px;margin-top:16px;line-height:1.7}
.footer b{color:#c5c9cf}
@media (prefers-reduced-motion:reduce){
  .logo-motion,.logo-speed,.wind,.smoke,.bars i{animation:none!important}
}
</style>
</head>

    <h1>أرسل موقعك بسرعة ⚡</h1>
    <p class="sub">حدد موقعك بدقة ثم اختر WhatsApp أو الرسائل لإرسال موقعك مباشرة إلى AKI DELIVERY.</p>

    <div class="speed-panel">
      <div>
        <div class="speed-number">FAST</div>
        <div class="speed-label">سريع • آمن • في الموعد</div>
      </div>
      <div class="bars"><i></i><i></i><i></i><i></i></div>
      <div style="text-align:left;direction:ltr">
        <div class="speed-number" style="font-size:22px">GPS</div>
        <div class="speed-label">HIGH ACCURACY</div>
      </div>
    </div>

    <div class="status"><span id="dot" class="dot"></span><span id="status">جاري تحديد موقعك...</span></div>

    <button id="locate" class="location-btn">📍 تحديث الموقع الآن</button>
    <button id="whatsapp" class="whatsapp" disabled>🟢 إرسال عبر WhatsApp</button>
    <button id="sms" class="sms" disabled>💬 إرسال عبر الرسائل SMS</button>

    <div class="footer">
      سيتم إرسال رابط Google Maps + الاتجاه المباشر + الإحداثيات + دقة GPS التقريبية.<br>
      <b>AKI DELIVERY</b> — FAST • SAFE • ALWAYS ON TIME
    </div>
  </section>
</main>

<script>
const phone="213556911632";
let bestPosition=null;
let watchId=null;
let timer=null;

const statusEl=document.getElementById("status");
const dot=document.getElementById("dot");
const wa=document.getElementById("whatsapp");
const sms=document.getElementById("sms");
const locate=document.getElementById("locate");

function buttons(enabled){wa.disabled=!enabled;sms.disabled=!enabled}
function setStatus(t,ready=false){statusEl.textContent=t;dot.className="dot"+(ready?" ready":"")}

function updatePosition(p){
  if(!p || !p.coords) return;
  if(!bestPosition || p.coords.accuracy < bestPosition.coords.accuracy){
    bestPosition=p;
    const a=Math.round(p.coords.accuracy);
    setStatus("تم تحديد الموقع — دقة تقريبية "+a+" متر",true);
    buttons(true);
  }
  // Stop early when a good reading is available.
  if(p.coords.accuracy<=15 && watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
    clearTimeout(timer);
  }
}

function startGPS(){
  if(!navigator.geolocation){
    setStatus("هذا المتصفح لا يدعم تحديد الموقع.");
    buttons(false); return;
  }
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  clearTimeout(timer);
  bestPosition=null;
  buttons(false);
  setStatus("جاري البحث عن أسرع وأفضل GPS...");

  watchId=navigator.geolocation.watchPosition(updatePosition,(e)=>{
    if(e.code===1) setStatus("اسمح للمتصفح بالوصول إلى الموقع ثم اضغط تحديث الموقع.");
    else setStatus("تعذر تحديد الموقع. تأكد من تشغيل GPS.");
  },{
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:8000
  });

  timer=setTimeout(()=>{
    if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
    if(bestPosition){
      setStatus("الموقع جاهز — دقة تقريبية "+Math.round(bestPosition.coords.accuracy)+" متر",true);
      buttons(true);
    }else{
      setStatus("لم يصل GPS بعد. اضغط «تحديث الموقع الآن» وحاول مرة أخرى.");
      buttons(false);
    }
  },12000);
}

function message(){
  if(!bestPosition)return null;
  const lat=bestPosition.coords.latitude;
  const lon=bestPosition.coords.longitude;
  const acc=Math.round(bestPosition.coords.accuracy);
  const maps=`https://www.google.com/maps?q=${lat},${lon}`;
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`;
  return `📍 موقع زبون AKI DELIVERY\n\n🗺️ موقع الزبون:\n${maps}\n\n🧭 الاتجاه المباشر:\n${dir}\n\n📌 الإحداثيات:\n${lat}, ${lon}\n\n📡 دقة GPS التقريبية:\n${acc} متر`;
}

wa.onclick=()=>{
  const m=message(); if(!m){startGPS();return}
  const e=encodeURIComponent(m);
  const intent=`intent://send?phone=${phone}&text=${e}#Intent;scheme=whatsapp;package=com.whatsapp;end`;
  const app=`whatsapp://send?phone=${phone}&text=${e}`;
  const web=`https://wa.me/${phone}?text=${e}`;
  if(/Android/i.test(navigator.userAgent)){
    location.href=intent;
    setTimeout(()=>location.href=app,1000);
    setTimeout(()=>location.href=web,2300);
  }else{
    location.href=app;
    setTimeout(()=>location.href=web,1400);
  }
};

sms.onclick=()=>{
  const m=message(); if(!m){startGPS();return}
  location.href=`sms:+${phone}?body=${encodeURIComponent(m)}`;
};

locate.onclick=startGPS;
startGPS();
</script>
</body>
